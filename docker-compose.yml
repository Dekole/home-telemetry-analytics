name: hta

services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hta:hta@db:5432/hta}
      - MEDIAMTX_INTERNAL_URL=${MEDIAMTX_INTERNAL_URL:-http://host.docker.internal:9997}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hta
      POSTGRES_PASSWORD: hta
      POSTGRES_DB: hta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./demo.mp4:/demo.mp4:ro
    restart: unless-stopped

volumes:
  postgres_data:
